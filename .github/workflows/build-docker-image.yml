name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/familylink-auth

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.9.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read add-on version from config.json
        id: addon_version
        run: echo "version=$(jq -r .version familylink-playwright/config.json)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata for addon image (tags, labels)
        id: meta-addon
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.9.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.addon_version.outputs.version }}

      - name: Extract metadata for standalone image (tags, labels)
        id: meta-standalone
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.9.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # No mutable ":standalone" tag: a moving production tag means an
          # unreviewed image rolls out on the next `docker compose pull`.
          # Consumers pin an explicit version, e.g. :2.0.0-standalone.
          tags: |
            type=ref,event=branch,suffix=-standalone
            type=ref,event=pr,suffix=-standalone
            type=semver,pattern={{version}},suffix=-standalone
            type=semver,pattern={{major}}.{{minor}},suffix=-standalone
            type=raw,value=${{ steps.addon_version.outputs.version }}-standalone

      - name: Build and push Home Assistant addon image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./familylink-playwright
          file: ./familylink-playwright/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-addon.outputs.tags }}
          labels: ${{ steps.meta-addon.outputs.labels }}
          cache-from: type=gha,scope=addon
          cache-to: type=gha,mode=max,scope=addon

      - name: Build and push standalone Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./familylink-playwright
          file: ./familylink-playwright/Dockerfile.standalone
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-standalone.outputs.tags }}
          labels: ${{ steps.meta-standalone.outputs.labels }}
          cache-from: type=gha,scope=standalone
          cache-to: type=gha,mode=max,scope=standalone

      - name: Summary
        run: |
          echo "✅ Images built and pushed successfully!"
          echo ""
          echo "📦 Home Assistant Addon (with Supervisor support):"
          echo "${{ steps.meta-addon.outputs.tags }}" | tr ',' '\n' | sed 's/^/  - /'
          echo ""
          echo "🐳 Standalone Docker (pure Docker, no HA Supervisor):"
          echo "${{ steps.meta-standalone.outputs.tags }}" | tr ',' '\n' | sed 's/^/  - /'
          echo ""
          echo "Usage:"
          echo "  # For Home Assistant OS/Supervised:"
          echo "  docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo ""
          echo "  # For standalone Docker (HA Container/Core):"
          echo "  docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.addon_version.outputs.version }}-standalone"
