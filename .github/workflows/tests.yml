name: Tests and security scans

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so a newly published advisory against a pinned dependency is
    # noticed without waiting for the next code change.
    - cron: "27 5 * * 1"

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v7.0.0
        with:
          # Matches the Python in the add-on's Debian 12 base image.
          python-version: "3.11"

      - name: Install the service dependencies from the hashed lock file
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r familylink-playwright/requirements.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run the test suite
        run: python -m pytest tests/ -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install linters
        run: pip install ruff

      - name: Lint the code that this branch owns
        run: ruff check familylink-playwright/app tests --select F,E9

      - name: Lint the integration (errors and undefined names only)
        run: ruff check custom_components/familylink --select F82,E9

  security:
    name: Dependency and code scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install scanners
        run: pip install pip-audit bandit

      - name: Audit the locked dependencies
        run: pip-audit -r familylink-playwright/requirements.txt --strict

      - name: Static security scan
        # Fails the build on medium severity and above. SHA-1 in the
        # SAPISIDHASH construction is required by Google's protocol and is
        # annotated in place; see custom_components/familylink/client/api.py.
        run: |
          bandit -r familylink-playwright/app custom_components/familylink \
            --severity-level medium --confidence-level medium

  docker:
    name: Docker builds (amd64 and aarch64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.9.0

      - name: Build the add-on image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./familylink-playwright
          file: ./familylink-playwright/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false

      - name: Build the standalone image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./familylink-playwright
          file: ./familylink-playwright/Dockerfile.standalone
          platforms: linux/amd64,linux/arm64
          push: false

  addon-config:
    name: Add-on and integration validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # hassfest lives in a subdirectory of that repository; the repository
      # root has no action.yml, and an unresolvable action fails the job before
      # continue-on-error can apply.
      - name: Home Assistant hassfest validation
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # 1.0.0
        continue-on-error: true

      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # 22.5.0
        with:
          category: integration
        continue-on-error: true
